name: 发布公开版

# 在线更新仍读取 main。本流程先同步 VERSION，再从同一提交打标签和打包。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '留空使用 VERSION；若已发布则递增。也可指定 v1.2.3'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: tg-persona-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 仅允许从 main 发布
        run: |
          test "$GITHUB_REF" = refs/heads/main || {
            echo "请在 Run workflow 中选择 main 分支" >&2
            exit 1
          }

      - name: 拉取最新 main 和完整标签
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 准备回归测试环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装轻量测试依赖
        run: python3 -m pip install fastapi telethon httpx uvicorn pyyaml

      - name: 回归测试
        run: |
          python3 -m unittest discover -s test_suite -p 'test_*.py' -v
          node test_suite/test_frontend.js
          python3 -m py_compile main.py updater.py release_tools/release_version.py

      - name: 计算版本并同步 VERSION
        id: ver
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 release_tools/release_version.py

      - name: 提交版本号并锁定打包提交
        id: commit
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore: 同步发布版本 $TAG"
          fi
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: 生成变更日志与安装包
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          tags = subprocess.check_output(['git', 'tag', '--list'], text=True).splitlines()
          tags = [t for t in tags if re.fullmatch(r'v\d+\.\d+\.\d+', t)]
          previous = max(tags, key=lambda t: tuple(map(int, t[1:].split('.'))), default='')
          target = f'{previous}..{os.environ["SHA"]}' if previous else os.environ['SHA']
          commits = subprocess.check_output(['git', 'log', target, '--oneline', '--no-decorate'], text=True)
          notes = '### 变更内容\n\n' + '\n'.join('- ' + line for line in commits.splitlines())
          notes += '\n\n安装包内 VERSION 与标签一致。面板在线更新仍拉取 main。\n'
          Path('dist/CHANGELOG.md').write_text(notes, encoding='utf-8')
          PY
          git archive --format=tar --prefix=tg-persona/ "$SHA" | gzip -n > "dist/TG-Persona-$TAG.tar.gz"
          git archive --format=zip --prefix=tg-persona/ -o "dist/TG-Persona-$TAG.zip" "$SHA"
          (cd dist && sha256sum "TG-Persona-$TAG.tar.gz" "TG-Persona-$TAG.zip" > SHA256SUMS.txt)
          tar -xOf "dist/TG-Persona-$TAG.tar.gz" tg-persona/VERSION

      - name: 原子推送 main 与对应标签
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          git tag -a "$TAG" "$SHA" -m "TG Persona $TAG"
          # main 期间如有新提交会拒绝推送，不强推、不发布过时快照。
          # 原子推送确保 VERSION 提交和标签同时成功或同时失败。
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"

      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "TG Persona $TAG" \
            --notes-file dist/CHANGELOG.md \
            "dist/TG-Persona-$TAG.tar.gz" \
            "dist/TG-Persona-$TAG.zip" \
            dist/SHA256SUMS.txt
          echo "已发布: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "VERSION、main 提交、标签、安装包版本已同步。" >> "$GITHUB_STEP_SUMMARY"
